name: CI Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Validate agent.yaml Syntax
        run: |
          python -c "
          import yaml
          with open('agent.yaml', 'r') as f:
              data = yaml.safe_load(f)
          assert data.get('version') == 4, 'agent.yaml must specify version: 4'
          assert 'providers' in data, 'providers mapping missing'
          assert 'models' in data, 'models mapping missing'
          assert 'dark-matter' in data['models'], 'dark-matter model missing'
          assert 'agents' in data, 'agents mapping missing'
          assert 'dark-matter' in data['agents'], 'dark-matter agent missing'
          print('agent.yaml is valid!')
          "

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

      - name: Validate analyze_logs.py CLI Arguments
        run: |
          python analyze_logs.py --json sample.log
          python analyze_logs.py sample.log --json
          python analyze_logs.py --help

      - name: Test Launcher Dry Run
        run: |
          chmod +x run.sh
          ./run.sh --dry-run

      - name: Validate Launcher Scripts & Documentation Assets
        run: |
          test -f run.sh
          test -f run.bat
          test -f run.ps1
          test -f Modelfile
          test -f .gitignore
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          echo "All essential repository assets verified!"
