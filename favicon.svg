<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="ringViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Filter for Quantum Bloom & Glow -->
    <filter id="cosmicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Nebula Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#ringCyan)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#4f46e5" opacity="0.18" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="90" fill="#0284c7" opacity="0.25" filter="url(#intenseGlow)"/>

  <!-- Orbital Gravitational Lensing Rings -->
  <!-- Ring 1 (Horizontal tilt) -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#ringCyan)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6 120 8" transform="rotate(-25 256 256)" filter="url(#cosmicGlow)"/>
  
  <!-- Ring 2 (Cross tilt) -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#ringViolet)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="140 12 18 10" transform="rotate(35 256 256)" filter="url(#cosmicGlow)"/>

  <!-- Ring 3 (Equatorial Orbit) -->
  <ellipse cx="256" cy="256" rx="195" ry="60" fill="none" stroke="url(#ringCyan)" stroke-width="3" stroke-linecap="round" opacity="0.75" transform="rotate(85 256 256)"/>

  <!-- Accretion Flow Accents -->
  <path d="M 120 256 C 120 180, 200 130, 256 130 C 330 130, 390 190, 390 256" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#cosmicGlow)"/>
  <path d="M 392 256 C 392 330, 312 382, 256 382 C 182 382, 122 322, 122 256" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.5" filter="url(#cosmicGlow)"/>

  <!-- Singularity Event Horizon (Outer Halo) -->
  <circle cx="256" cy="256" r="62" fill="#030712" stroke="url(#ringCyan)" stroke-width="4" filter="url(#cosmicGlow)"/>
  <circle cx="256" cy="256" r="54" fill="#050814"/>

  <!-- Dark Matter Core Nucleus -->
  <circle cx="256" cy="256" r="32" fill="url(#coreGlow)" filter="url(#intenseGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Cosmic Photon Sparks -->
  <circle cx="118" cy="190" r="3.5" fill="#38bdf8" filter="url(#cosmicGlow)"/>
  <circle cx="395" cy="320" r="3" fill="#c084fc" filter="url(#cosmicGlow)"/>
  <circle cx="370" cy="150" r="4" fill="#ffffff" filter="url(#cosmicGlow)"/>
  <circle cx="140" cy="360" r="2.5" fill="#34d399"/>
  <circle cx="256" cy="75" r="3" fill="#38bdf8"/>
  <circle cx="256" cy="437" r="3" fill="#c084fc"/>
</svg>
